name: sleepwise
description: "SleepWise - Smart Sleep Tracker & Alarm"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Charts
  fl_chart: ^0.70.2

  # Audio
  audioplayers: ^6.1.0
  record: ^5.1.2

  # Permissions
  permission_handler: ^11.3.1

  # Settings / preferences
  shared_preferences: ^2.3.4

  # Local database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Notifications & scheduling
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0

  # Localization / date formatting
  intl: ^0.20.2

  # Screen control
  wakelock_plus: ^1.2.8
  screen_brightness: ^1.0.1

  # Health platform integration
  health: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Hive code generation
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/audio/

  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat/Montserrat-Light.ttf
          weight: 300
        - asset: assets/fonts/Montserrat/Montserrat-Regular.ttf
          weight: 400
        - asset: assets/fonts/Montserrat/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat/Montserrat-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter-Light.ttf
          weight: 300
        - asset: assets/fonts/Inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter/Inter-Medium.ttf
          weight: 500
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono/JetBrainsMono-Light.ttf
          weight: 300
        - asset: assets/fonts/JetBrainsMono/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono/JetBrainsMono-Medium.ttf
          weight: 500
