name: sleepwise
description: "SleepWise - Smart Sleep Tracker & Alarm"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Charts
  fl_chart: ^0.70.2

  # Audio
  audioplayers: ^6.1.0

  # Permissions
  permission_handler: ^11.3.1

  # Settings / preferences
  shared_preferences: ^2.3.4

  # Local database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Localization / date formatting
  intl: ^0.19.0

  # Typography
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Hive code generation
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
